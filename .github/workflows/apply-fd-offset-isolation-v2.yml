name: Apply FD offset isolation fix v2

on:
  push:
    branches: [ fix/fd-offset-isolation ]
    paths:
      - .github/workflows/apply-fd-offset-isolation-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Patch independent descriptor handling
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              start_index = text.find(start)
              if start_index < 0:
                  raise RuntimeError(f"{label}: start marker not found")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise RuntimeError(f"{label}: end marker not found")
              return text[:start_index] + dedent(replacement).strip("\n") + "\n\n" + text[end_index:]

          engine_path = Path("app/src/main/java/app/clipforge/media/FfmpegMediaEngine.kt")
          engine = engine_path.read_text()

          engine = replace_between(
              engine,
              "internal fun fdSegmentConcatScript(",
              "private fun pathSegmentConcatScript",
              '''
              internal fun fdSegmentConcatScript(fds: List<Int>, segments: List<MediaSegment>): String {
                  require(fds.size == segments.size) { "Each source segment needs an independent fd" }
                  return buildString {
                      appendLine("ffconcat version 1.0")
                      segments.forEachIndexed { index, segment ->
                          appendLine("file 'fd:'")
                          appendLine("option fd ${fds[index]}")
                          appendLine("inpoint ${concatTimestamp(segment.startMs)}")
                          appendLine("outpoint ${concatTimestamp(segment.endMs)}")
                      }
                  }
              }
              ''',
              "fd segment script",
          )

          engine = replace_between(
              engine,
              "private fun fdSmartConcatScript(",
              "private fun concatTimestamp",
              '''
              internal fun fdSmartConcatScript(fds: List<Int>, parts: List<SmartConcatInput>): String {
                  val sourceCount = parts.count { it is SmartConcatInput.SourceSegment }
                  require(fds.size == sourceCount) { "Each smart-copy source segment needs an independent fd" }
                  var sourceIndex = 0
                  return buildString {
                      appendLine("ffconcat version 1.0")
                      parts.forEach { part ->
                          when (part) {
                              is SmartConcatInput.SourceSegment -> {
                                  appendLine("file 'fd:'")
                                  appendLine("option fd ${fds[sourceIndex++]}")
                                  appendLine("inpoint ${concatTimestamp(part.segment.startMs)}")
                                  appendLine("outpoint ${concatTimestamp(part.segment.endMs)}")
                              }
                              is SmartConcatInput.RenderedFile -> {
                                  appendLine("file '${escapeConcatPathValue(part.path)}'")
                              }
                          }
                      }
                  }
              }
              ''',
              "smart fd script",
          )

          engine = replace_between(
              engine,
              "    suspend fun concatSmartPartsDescriptors(",
              "    private suspend fun concatSmartParts(",
              '''
                  suspend fun concatSmartPartsDescriptors(
                      inputFds: List<Int>,
                      outputFd: Int,
                      outputName: String,
                      parts: List<SmartConcatInput>,
                      expectedDurationMs: Long,
                      workingDirectory: File,
                      onProgressPercent: (Int) -> Unit = {},
                  ) = withContext(Dispatchers.IO) {
                      concatSmartParts(
                          script = fdSmartConcatScript(inputFds, parts),
                          usesFdSource = inputFds.isNotEmpty(),
                          outputFd = outputFd,
                          outputName = outputName,
                          expectedDurationMs = expectedDurationMs,
                          workingDirectory = workingDirectory,
                          onProgressPercent = onProgressPercent,
                      )
                  }
              ''',
              "smart descriptor concat",
          )

          engine = replace_between(
              engine,
              "    suspend fun concatSegmentsLosslessDescriptors(",
              "    suspend fun concatLossless(",
              '''
                  suspend fun concatSegmentsLosslessDescriptors(
                      inputFds: List<Int>,
                      outputFd: Int,
                      outputName: String,
                      segments: List<MediaSegment>,
                      workingDirectory: File,
                      onProgressPercent: (Int) -> Unit = {},
                  ) = withContext(Dispatchers.IO) {
                      require(segments.size >= 2) { "At least two segments are required" }
                      require(inputFds.size == segments.size) { "Each source segment needs an independent fd" }
                      workingDirectory.mkdirs()
                      val listFile = File(workingDirectory, ".clipforge-segments-${System.nanoTime()}.ffconcat")
                      try {
                          listFile.writeText(fdSegmentConcatScript(inputFds, segments))
                          runFfmpeg(
                              arguments = listOf(
                                  "-hide_banner", "-y",
                                  "-protocol_whitelist", "file,fd,crypto,data",
                                  "-f", "concat",
                                  "-safe", "0",
                                  "-auto_convert", "1",
                                  "-i", listFile.absolutePath,
                                  "-map", "0",
                                  "-c", "copy",
                                  "-fflags", "+genpts",
                                  "-avoid_negative_ts", "make_zero",
                                  "-f", muxerFor(outputName),
                                  "-fd", outputFd.toString(),
                                  "fd:",
                              ),
                              expectedDurationMs = segments.sumOf(MediaSegment::durationMs),
                              onProgressPercent = onProgressPercent,
                          )
                      } finally {
                          listFile.delete()
                      }
                  }
              ''',
              "lossless descriptor concat",
          )
          engine_path.write_text(engine)

          exporter_path = Path("app/src/main/java/app/clipforge/workflow/MultiCutExporter.kt")
          exporter = exporter_path.read_text()
          exporter = exporter.replace("import java.io.FileDescriptor\n", "")
          exporter = exporter.replace("        var inputDescriptor: ParcelFileDescriptor? = null\n", "")

          exporter = replace_between(
              exporter,
              '            } else {\n                onProgress("元動画を直接開いています", 8)',
              '            onProgress("書き出しを完了しています", 95)',
              '''
                          } else {
                              onProgress("元動画を直接開いています", 8)
                              if (cutMode == CutMode.SMART) {
                                  exportSmartDescriptor(
                                      source = source,
                                      durationMs = durationMs,
                                      keepSegments = keepSegments,
                                      outputFd = outputDescriptor.fd,
                                      outputName = outputName,
                                      workDir = workDir,
                                      onProgress = onProgress,
                                      onConcatProgress = ::reportSmartConcatProgress,
                                  )
                              } else {
                                  exportLosslessDescriptor(
                                      source = source,
                                      keepSegments = keepSegments,
                                      outputFd = outputDescriptor.fd,
                                      outputName = outputName,
                                      workDir = workDir,
                                      onProgress = ::reportLosslessWriteProgress,
                                  )
                              }
                          }
              ''',
              "remote export branch",
          )
          exporter = exporter.replace("            runCatching { inputDescriptor?.close() }\n            inputDescriptor = null\n", "")
          exporter = exporter.replace("            runCatching { inputDescriptor?.close() }\n", "")

          exporter = replace_between(
              exporter,
              "    private suspend fun exportLosslessDescriptor(",
              "    private suspend fun exportSmartLocal(",
              '''
                  private suspend fun exportLosslessDescriptor(
                      source: PickedVideo,
                      keepSegments: List<MediaSegment>,
                      outputFd: Int,
                      outputName: String,
                      workDir: File,
                      onProgress: (Int) -> Unit,
                  ) {
                      val descriptorCount = if (keepSegments.size == 1) 1 else keepSegments.size
                      withReadDescriptors(source, descriptorCount) { descriptors ->
                          if (keepSegments.size == 1) {
                              val segment = keepSegments.single()
                              mediaEngine.cutLosslessDescriptors(
                                  inputFd = descriptors.single().fd,
                                  outputFd = outputFd,
                                  outputName = outputName,
                                  startMs = segment.startMs,
                                  endMs = segment.endMs,
                                  onProgressPercent = onProgress,
                              )
                          } else {
                              mediaEngine.concatSegmentsLosslessDescriptors(
                                  inputFds = descriptors.map { it.fd },
                                  outputFd = outputFd,
                                  outputName = outputName,
                                  segments = keepSegments,
                                  workingDirectory = workDir,
                                  onProgressPercent = onProgress,
                              )
                          }
                      }
                  }
              ''',
              "lossless remote export",
          )

          exporter = replace_between(
              exporter,
              "    private suspend fun exportSmartDescriptor(",
              "    private fun planSmartParts(",
              '''
                  private suspend fun exportSmartDescriptor(
                      source: PickedVideo,
                      durationMs: Long,
                      keepSegments: List<MediaSegment>,
                      outputFd: Int,
                      outputName: String,
                      workDir: File,
                      onProgress: (String, Int?) -> Unit,
                      onConcatProgress: (Int) -> Unit,
                  ) {
                      onProgress("スマートカットの境界を確認しています", 10)
                      val signature = withReadDescriptors(source, 1) { descriptors ->
                          mediaEngine.probeDescriptor(descriptors.single().fd, source.displayName)
                      }
                      val planned = planSmartParts(
                          durationMs = durationMs,
                          keepSegments = keepSegments,
                          before = { position ->
                              openReadDescriptor(source).use { descriptor ->
                                  syncFrameResolver.syncFrameAtOrBefore(descriptor.fileDescriptor, durationMs, position)
                              }
                          },
                          after = { position ->
                              openReadDescriptor(source).use { descriptor ->
                                  syncFrameResolver.syncFrameAtOrAfter(descriptor.fileDescriptor, durationMs, position)
                              }
                          },
                      )
                      val reencodeCount = planned.count { it is SmartCutPart.Reencode }
                      if (reencodeCount == 0) {
                          exportLosslessDescriptor(source, keepSegments, outputFd, outputName, workDir) { percent ->
                              val overall = (12 + percent * 82 / 100).coerceIn(12, 94)
                              onProgress("キーフレーム一致のため無劣化で書き出し中 $percent%", overall)
                          }
                          return
                      }

                      val concatParts = renderSmartParts(
                          planned = planned,
                          workDir = workDir,
                          sourceExtension = sourceExtension(source.displayName),
                          render = { segment, file, callback ->
                              withReadDescriptors(source, 1) { descriptors ->
                                  mediaEngine.renderSmartBoundaryDescriptor(
                                      inputFd = descriptors.single().fd,
                                      output = file,
                                      sourceSignature = signature,
                                      segment = segment,
                                      onProgressPercent = callback,
                                  )
                              }
                          },
                          onProgress = onProgress,
                      )
                      val sourcePartCount = concatParts.count { it is SmartConcatInput.SourceSegment }
                      withReadDescriptors(source, sourcePartCount) { descriptors ->
                          mediaEngine.concatSmartPartsDescriptors(
                              inputFds = descriptors.map { it.fd },
                              outputFd = outputFd,
                              outputName = outputName,
                              parts = concatParts,
                              expectedDurationMs = keepSegments.sumOf(MediaSegment::durationMs),
                              workingDirectory = workDir,
                              onProgressPercent = onConcatProgress,
                          )
                      }
                  }
              ''',
              "smart remote export",
          )

          helper_marker = "    private fun sourceExtension(displayName: String): String ="
          helper_index = exporter.find(helper_marker)
          if helper_index < 0:
              raise RuntimeError("descriptor helper insertion marker not found")
          helper = dedent('''
                  private suspend fun <T> withReadDescriptors(
                      source: PickedVideo,
                      count: Int,
                      block: suspend (List<ParcelFileDescriptor>) -> T,
                  ): T {
                      require(count >= 0) { "Descriptor count must not be negative" }
                      val descriptors = mutableListOf<ParcelFileDescriptor>()
                      try {
                          repeat(count) { descriptors += openReadDescriptor(source) }
                          return block(descriptors)
                      } finally {
                          descriptors.asReversed().forEach { descriptor ->
                              runCatching { descriptor.close() }
                          }
                      }
                  }

          ''').lstrip("\n")
          exporter = exporter[:helper_index] + helper + exporter[helper_index:]
          exporter_path.write_text(exporter)

          Path("app/src/test/java/app/clipforge/media/FdSegmentConcatScriptTest.kt").write_text(dedent('''
              package app.clipforge.media

              import org.junit.Assert.assertEquals
              import org.junit.Test

              class FdSegmentConcatScriptTest {
                  @Test
                  fun writesIndependentSeekableFdEntryPerKeptSegment() {
                      val script = fdSegmentConcatScript(
                          fds = listOf(42, 43),
                          segments = listOf(
                              MediaSegment(0L, 1_000L),
                              MediaSegment(2_500L, 4_000L),
                          ),
                      )

                      assertEquals(
                          """ffconcat version 1.0
              file 'fd:'
              option fd 42
              inpoint 0.000
              outpoint 1.000
              file 'fd:'
              option fd 43
              inpoint 2.500
              outpoint 4.000
              """,
                          script,
                      )
                  }

                  @Test(expected = IllegalArgumentException::class)
                  fun rejectsDescriptorReuseAcrossSegments() {
                      fdSegmentConcatScript(
                          fds = listOf(42),
                          segments = listOf(MediaSegment(0L, 1_000L), MediaSegment(2_000L, 3_000L)),
                      )
                  }
              }
          ''').lstrip())

          Path("app/src/test/java/app/clipforge/media/FdSmartConcatScriptTest.kt").write_text(dedent('''
              package app.clipforge.media

              import org.junit.Assert.assertEquals
              import org.junit.Test

              class FdSmartConcatScriptTest {
                  @Test
                  fun consumesIndependentFdForEverySourcePart() {
                      val script = fdSmartConcatScript(
                          fds = listOf(51, 52),
                          parts = listOf(
                              SmartConcatInput.SourceSegment(MediaSegment(0L, 1_000L)),
                              SmartConcatInput.RenderedFile("/tmp/boundary.mkv"),
                              SmartConcatInput.SourceSegment(MediaSegment(2_000L, 3_000L)),
                          ),
                      )

                      assertEquals(
                          """ffconcat version 1.0
              file 'fd:'
              option fd 51
              inpoint 0.000
              outpoint 1.000
              file '/tmp/boundary.mkv'
              file 'fd:'
              option fd 52
              inpoint 2.000
              outpoint 3.000
              """,
                          script,
                      )
                  }
              }
          ''').lstrip())
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: gradle --no-daemon :app:testDebugUnitTest
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-fd-offset-isolation.yml \
                 .github/workflows/apply-fd-offset-isolation-v2.yml
          git add app/src/main/java/app/clipforge/media/FfmpegMediaEngine.kt \
                  app/src/main/java/app/clipforge/workflow/MultiCutExporter.kt \
                  app/src/test/java/app/clipforge/media/FdSegmentConcatScriptTest.kt \
                  app/src/test/java/app/clipforge/media/FdSmartConcatScriptTest.kt
          git commit -m "Fix shared file descriptor offsets during remote cuts"
          git push origin HEAD:fix/fd-offset-isolation