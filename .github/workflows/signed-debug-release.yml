name: Signed Debug Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: clipforge-signed-debug-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Compute Android build number
        id: build_number
        run: echo "value=$(sh .github/scripts/android-build-number.sh)" >> "$GITHUB_OUTPUT"

      - name: Detect stable signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Stable signing secrets are not configured. Skipping debug-latest self-update release."
          fi

      - name: Decode stable signing key
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/clipforge-stable.jks"

      - name: Build stable-signed debug APK
        if: steps.signing.outputs.ready == 'true'
        env:
          CLIPFORGE_KEYSTORE: ${{ runner.temp }}/clipforge-stable.jks
          CLIPFORGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CLIPFORGE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CLIPFORGE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug -PbuildNumber=${{ steps.build_number.outputs.value }}

      - name: Name signed APK
        if: steps.signing.outputs.ready == 'true'
        id: apk
        run: |
          set -eu
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          APK_NAME="ClipForge-${VERSION}-b${{ steps.build_number.outputs.value }}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload stable-signed APK artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-${{ steps.build_number.outputs.value }}-signed-debug
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish debug-latest release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release delete debug-latest --cleanup-tag -y 2>/dev/null || true
          gh release create debug-latest \
            "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "ClipForge ${{ steps.apk.outputs.version }} debug build ${{ steps.build_number.outputs.value }}" \
            --prerelease \
            --notes "Stable-signed ClipForge debug APK built from main at $GITHUB_SHA. Used by the in-app updater."
