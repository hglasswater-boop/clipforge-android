name: Apply scene markers and jacket preservation

on:
  push:
    branches:
      - feature/scene-markers-preserve-jacket

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/scene-markers-preserve-jacket
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Relax one-shot patch uniqueness guard
        run: sed -i 's/if count != 1:/if count < 1:/' .github/scripts/apply-scene-jacket-feature.py

      - name: Apply feature patch
        run: python3 .github/scripts/apply-scene-jacket-feature.py

      - name: Validate Android build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add scene markers and preserve jacket art"
          git push origin HEAD:feature/scene-markers-preserve-jacket
